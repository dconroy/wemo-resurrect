[project]
name = "wemo-resurrect"
version = "0.1.0"
description = "LAN-only admin dashboard for legacy Belkin WeMo plugs and switches"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pywemo>=2.1.0",
    "apscheduler>=3.10.4",
    "pydantic-settings>=2.6.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
